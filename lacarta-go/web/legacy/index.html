// ---- Notifications, for every project: a new question, an agent's reply in a "Talk about this"
// thread, a session that needs you in its terminal, an agent that finished its turn and listens.
// Shown as a toast in the page and, when the tab is in the background and the user allowed it,
// as a system notification. Whatever is already there when the page loads is not announced.
let seenEvents = null;
const freshQs = new Set();   // "<project>/<question>" that arrived while the page was open: the card flashes
const toasts = new Map();    // event key -> [project id, question id or null]

function hubEvents() {
  const out = [];
  hub.projects.filter(p => !p.archived).forEach(p => {
    (p.questions || []).forEach(q => {
      out.push({ key: `${p.id}/${q.id}`, p, q, kind: "ask" });
      if (q.replies) out.push({ key: `${p.id}/${q.id}#${q.replies}`, p, q, kind: "reply" });
    });
    if (p.attention) out.push({ key: `${p.id}/attention/${p.attention.at}`, p, kind: "terminal" });
    if (p.listening_since) out.push({ key: `${p.id}/listen/${p.listening_since}`, p, kind: "turn" });
  });
  return out;
}

function notifyChanges() {
  const events = hubEvents();
  if (seenEvents === null) { seenEvents = new Set(events.map(e => e.key)); return; }
  const r = parseRoute();
  events.filter(e => !seenEvents.has(e.key)).forEach(e => {
    seenEvents.add(e.key);
    const here = r.page === "project" && r.pid === e.p.id;
    if (e.kind === "turn" && here && r.view === "chat") return;   // you are already looking at it
    if (e.kind === "ask") { freshQs.add(e.key); setTimeout(() => freshQs.delete(e.key), 4000); }
    const who = e.q ? e.q.asked_by || "An agent" : (e.p.agent || {}).name || "The agent";
    const head = { ask: `${who} needs you`, reply: `${who} replied`, terminal: `${who} needs you in the terminal`,
                   turn: `${who} finished its turn` }[e.kind];
    const title = e.q ? e.q.title : e.kind === "terminal" ? e.p.attention.text : "Listening for your next message in the console.";
    const href = P(e.p.id, e.q ? "questions" : e.kind === "turn" ? "chat" : "overview");
    showToast(e, { id: `${e.p.id}:${who}`, name: who }, head, title, href);
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      try {
        const n = new Notification(`${head} · ${e.p.name}`, { body: title, tag: e.key });
        n.onclick = () => { window.focus(); location.hash = href; n.close(); };
      } catch (err) {}
    }
  });
  // An answered question, a cleared terminal prompt or a new turn takes its toasts with it.
  const live = new Set(events.map(e => e.key.split("#")[0]));
  toasts.forEach((base, key) => { if (!live.has(base)) dismissToast(key); });
}

function showToast(e, a, head, title, href) {
  const box = document.getElementById("toasts");
  while (box.children.length >= 4) dismissToast(box.firstElementChild.dataset.key);
  const el = document.createElement("div");
  const urgent = (e.q && e.q.triage) || e.kind === "terminal";
  el.className = `toast ${urgent ? "danger" : ""}`;
  el.dataset.key = e.key;
  el.innerHTML = `${avatar(a, "md")}<div style="min-width:0">
      <div class="small muted">${esc(head)} · ${esc(e.p.name)}${e.q ? ` · ${esc(e.q.id)}` : ""}${e.q && e.q.triage ? " · development stopped" : ""}</div>
      <div class="t-title">${esc(title)}</div>
      <div class="t-actions"><a class="btn sm primary" href="${href}">${{ ask: "Answer", reply: "Read reply", terminal: "Open", turn: "Open chat" }[e.kind]}</a></div></div>
    <button type="button" class="close" aria-label="Dismiss">×</button>`;
  el.querySelector("a").onclick = () => dismissToast(e.key);
  el.querySelector(".close").onclick = () => dismissToast(e.key);
  box.appendChild(el);
  toasts.set(e.key, e.key.split("#")[0]);
}

function dismissToast(key) {
  document.querySelector(`#toasts .toast[data-key="${CSS.escape(key)}"]`)?.remove();
  toasts.delete(key);
}

// System notifications need a secure context (localhost is one) and the user's permission.
function setupNotifyButton() {
  const b = document.getElementById("notify");
  b.hidden = !("Notification" in window) || !window.isSecureContext || Notification.permission !== "default";
  b.onclick = async () => { try { await Notification.requestPermission(); } catch (e) {} setupNotifyButton(); };
}
setupNotifyButton();

async function tick() {
  if (await poll()) { notifyChanges(); pendingRender = true; }
  if (pendingRender && !typing()) { pendingRender = false; render(); }
}

// ---- Mermaid diagrams: ```mermaid blocks in any markdown become SVG.
// The 3 MB library loads only once a page has a diagram. Renders are cached by theme and source,
// so the 2.5 s refresh re-inserts the SVG instead of redrawing it.
const diagramCache = new Map();
let mermaidLoad = null, mermaidTheme = "", diagramSeq = 0;

function loadMermaid() {
  if (!mermaidLoad) {
    mermaidLoad = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "/vendor/mermaid.min.js";
      s.onload = () => window.mermaid ? resolve(window.mermaid) : reject(new Error("Mermaid did not load."));
      s.onerror = () => { mermaidLoad = null; reject(new Error("The diagram library could not be loaded from the console server.")); };
      document.head.appendChild(s);
    });
  }
  return mermaidLoad;
}

function themeName() {
  const t = document.documentElement.dataset.theme;
  return t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function configureMermaid(m) {
  const name = themeName();
  if (mermaidTheme === name) return;
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(`--${n}`).trim();
  m.initialize({
    startOnLoad: false,
    securityLevel: "strict",       // no scripts or click handlers in labels
    theme: "base",
    darkMode: name === "dark",
    fontFamily: "Manrope, ui-sans-serif, system-ui, sans-serif",
    flowchart: { htmlLabels: false, curve: "basis" },  // plain SVG text: no foreignObject HTML
    themeVariables: {
      fontFamily: "Manrope, ui-sans-serif, system-ui, sans-serif", fontSize: "14px",
      background: v("surface"), textColor: v("text"),
      primaryColor: v("brand-subtle"), primaryTextColor: v("text"), primaryBorderColor: v("brand-border"),
      secondaryColor: v("info-subtle"), secondaryTextColor: v("text"), secondaryBorderColor: v("info-border"),
      tertiaryColor: v("surface-sunken"), tertiaryTextColor: v("text"), tertiaryBorderColor: v("border"),
      lineColor: v("border-strong"), edgeLabelBackground: v("surface-raised"),
      clusterBkg: v("surface-sunken"), clusterBorder: v("border"), titleColor: v("text"),
      noteBkgColor: v("accent-subtle"), noteTextColor: v("text"), noteBorderColor: v("accent-border"),
      actorBkg: v("brand-subtle"), actorBorder: v("brand-border"), actorTextColor: v("text"),
      signalColor: v("text-secondary"), signalTextColor: v("text"), labelBoxBkgColor: v("surface-raised"),
      errorBkgColor: v("danger-subtle"), errorTextColor: v("danger"),
    },
  });
  mermaidTheme = name;
}

function diagramSource(src) {
  return `<details class="diagram-src"><summary class="small">Source</summary><pre><code>${esc(src)}</code></pre></details>`;
}

async function renderDiagrams(root) {
  const blocks = [...root.querySelectorAll("pre > code.language-mermaid")];
  if (!blocks.length) return;
  const figs = blocks.map(code => {
    const src = code.textContent, fig = document.createElement("figure");
    fig.className = "diagram";
    const hit = diagramCache.get(themeName() + "\n" + src);
    fig.innerHTML = hit || `<div class="small muted">Drawing diagram…</div>`;
    code.parentElement.replaceWith(fig);
    return hit ? null : [fig, src];
  }).filter(Boolean);
  if (!figs.length) return;
  let m;
  try { m = await loadMermaid(); } catch (e) {
    figs.forEach(([fig, src]) => { fig.innerHTML = `<div class="err">${esc(e.message)}</div>${diagramSource(src)}`; });
    return;
  }
  configureMermaid(m);
  const theme = themeName();
  for (const [fig, src] of figs) {
    let html;
    try {
      const { svg } = await m.render(`diagram-${++diagramSeq}`, src);
      // Mermaid sanitises labels itself; sanitise the SVG again before it touches the page.
      html = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true }, ADD_TAGS: ["style"] }) + diagramSource(src);
      diagramCache.set(theme + "\n" + src, html);
    } catch (e) {
      const msg = String((e && (e.str || e.message)) || e).split("\n")[0];
      html = `<div class="err">This diagram has a syntax error: ${esc(msg)}</div>${diagramSource(src)}`;
      // mermaid can leave its scratch nodes in the body when a diagram fails
      [`ddiagram-${diagramSeq}`, `diagram-${diagramSeq}`].forEach(id => document.getElementById(id)?.remove());
    }
    fig.innerHTML = html;
  }
}

window.addEventListener("hashchange", async () => { if (data && parseRoute().pid !== data.id) data = null; render(); window.scrollTo(0, 0); await refresh(); });
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 0));
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("lacarta-theme", root.dataset.theme); } catch (e) {}
  render();  // diagrams are drawn with the theme's colours
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
try { const t = localStorage.getItem("lacarta-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
tick(); setInterval(tick, 2500);
</script>
</body>
</html>
